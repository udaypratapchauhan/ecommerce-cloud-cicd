name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Backend
        run: |
          cd backend
          npm install
          node --check src/server.js
          node --check src/config/db.js
          node --check src/controllers/productController.js

      - name: Build Frontend
        env:
          VITE_API_URL: https://ecommerce-backend-5ts8.onrender.com
        run: |
          cd frontend
          npm install
          npm run build

  deploy-backend:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render webhook..."
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render deploy triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK secret not provided, skipping webhook trigger."
          fi
